<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme:dark)">
<meta name="description" content="赵瑞阳 · 中国科学院大学电子信息工程 · Python / Blender · 个人简历">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<title>赵瑞阳 · 个人简历</title>
<script>(function(){try{var t=localStorage.getItem('zy-theme');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>
:root{
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  --bg:#f4f6fb;--card:#fff;--text:#131824;--muted:#5d6880;
  --line:rgba(19,24,36,.09);--line2:rgba(19,24,36,.18);
  --p:#3557d6;--ps:rgba(53,87,214,.1);
  --a:#0ea5a5;--as:rgba(14,165,165,.1);
  --nav:rgba(255,255,255,.82);--chip:rgba(53,87,214,.06);
  --sh:0 1px 2px rgba(16,24,40,.04),0 14px 34px -18px rgba(16,24,40,.35);
  --sh2:0 2px 6px rgba(16,24,40,.06),0 22px 46px -20px rgba(16,24,40,.45);
  --g1:rgba(53,87,214,.16);--g2:rgba(14,165,165,.14);
  --bt:#fff;--r:14px;
}
[data-theme=dark]{
  --bg:#0a0d14;--card:#121724;--text:#e9edf6;--muted:#98a3ba;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.22);
  --p:#7f9bff;--ps:rgba(127,155,255,.14);
  --a:#3fd6c8;--as:rgba(63,214,200,.12);
  --nav:rgba(10,13,20,.8);--chip:rgba(127,155,255,.1);
  --sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -20px rgba(0,0,0,.85);
  --sh2:0 2px 8px rgba(0,0,0,.45),0 26px 52px -22px rgba(0,0,0,.95);
  --g1:rgba(93,124,255,.2);--g2:rgba(63,214,200,.14);--bt:#0a0d14;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font:400 15px/1.7 var(--f);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;text-rendering:optimizeLegibility;
  padding-bottom:calc(68px + env(safe-area-inset-bottom));
}
@media(min-width:640px){body{padding-bottom:0}}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(560px 340px at 8% -8%,var(--g1),transparent 62%),
    radial-gradient(520px 340px at 96% 0%,var(--g2),transparent 64%);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
svg{display:block;flex:0 0 auto}
ul{margin:0;padding:0;list-style:none}
img{max-width:100%;display:block}

/* ---------- 导航 ---------- */
.nav{
  position:sticky;top:0;z-index:100;background:var(--nav);
  backdrop-filter:blur(16px) saturate(170%);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:6px 16px;padding-top:calc(6px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:800;font-size:15px;letter-spacing:.01em}
.dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 0 0 4px var(--ps)}
.nav-links{display:none;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:9px;
  color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap;
  transition:color .18s ease,background-color .18s ease;
}
.nav-links a:hover,.nav-links a.on{color:var(--p);background:var(--ps)}
.nav-act{display:flex;gap:8px;margin-left:auto}
.ico{
  width:44px;height:44px;display:grid;place-items:center;border-radius:11px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;
  transition:transform .18s ease,border-color .18s ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.ico:hover{border-color:var(--line2)}
.ico:active{transform:scale(.94)}
[data-theme=light] .sun{display:none}
[data-theme=dark] .moon{display:none}
@media(min-width:780px){
  .nav-links{display:flex}
  .nav-act{margin-left:0}
}

/* ---------- 布局 ---------- */
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 16px}
section[id]{scroll-margin-top:74px}
.sec{padding-top:34px}
@media(min-width:900px){.sec{padding-top:46px}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sh .i{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--p);background:var(--ps);padding:3px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
.sh h2{margin:0;font-size:1.18rem;font-weight:800;letter-spacing:-.015em}
.sh .s{font-size:12.5px;color:var(--muted)}
@media(min-width:600px){.sh .s{margin-left:auto}}

/* ---------- Hero ---------- */
.hero{padding-top:30px}
@media(min-width:900px){.hero{padding-top:52px}}
.hero-grid{display:grid;gap:16px}
@media(min-width:900px){.hero-grid{grid-template-columns:1.55fr 1fr;gap:26px;align-items:stretch}}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);
  background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px;box-shadow:var(--sh);
}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--a);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--as)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1.name{
  margin:12px 0 6px;font-size:clamp(2.1rem,7vw,3.4rem);font-weight:800;line-height:1.08;letter-spacing:-.03em;
  background:linear-gradient(118deg,var(--text) 18%,var(--p) 62%,var(--a) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
.role{margin:0 0 10px;font-size:14.5px;font-weight:700;color:var(--p)}
.sum{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.85;max-width:56ch}
.bgs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.bgd{
  font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);
  border:1px solid var(--line);padding:4px 11px;border-radius:999px;
  transition:color .18s ease,border-color .18s ease;
}
.bgd:hover{color:var(--p);border-color:var(--p)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.loc{margin:0;font-size:12.5px;color:var(--muted)}

.hcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;
  transition:transform .22s ease,box-shadow .22s ease;
}
.hcard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.hch{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* ---------- 社交头像 ---------- */
.socials{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:12px 10px;border-radius:12px;
  background:
    radial-gradient(120% 120% at 0% 0%,var(--ps),transparent 60%),
    radial-gradient(120% 120% at 100% 100%,var(--as),transparent 60%),
    var(--chip);
  border:1px solid var(--line);
}
.social{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  min-width:0;
}
.social-img{
  position:relative;width:100%;max-width:60px;aspect-ratio:1/1;
  border-radius:50%;overflow:hidden;
  background:var(--card);
  border:2px solid var(--line);
  box-shadow:0 6px 16px -10px rgba(16,24,40,.5);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.social-img::after{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  background:linear-gradient(135deg,var(--p),var(--a));
  opacity:0;transition:opacity .22s ease;
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);
          mask:radial-gradient(circle,transparent 58%,#000 60%);
  pointer-events:none;
}
.social-img img{
  width:100%;height:100%;object-fit:cover;display:block;
  background:var(--chip);
}
.social:hover .social-img{
  transform:translateY(-3px) scale(1.04);
  border-color:transparent;
  box-shadow:0 14px 26px -14px var(--p);
}
.social:hover .social-img::after{opacity:1}
.social span{
  font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.02em;
  transition:color .18s ease;
}
.social:hover span{color:var(--p)}

@media(max-width:380px){
  .social-img{max-width:52px}
  .socials{gap:6px;padding:10px 8px}
}

.hcl{display:flex;flex-direction:column;gap:8px}
.hcl li{display:flex;align-items:baseline;gap:10px;font-size:13.5px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.hcl li:last-child{border-bottom:0;padding-bottom:0}
.hcl b{flex:0 0 56px;color:var(--muted);font-size:12.5px;font-weight:400}
.hcl span{font-weight:600;word-break:break-all}
.hcb{margin-top:auto;justify-content:center}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;
  border-radius:11px;font-size:13.5px;font-weight:600;line-height:1;cursor:pointer;
  border:1px solid transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease;
}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--p),var(--a));color:var(--bt);box-shadow:0 10px 22px -12px var(--p)}
.bp:hover{filter:brightness(1.06)}
.bg{background:var(--card);border-color:var(--line);color:var(--text)}
.bg:hover{border-color:var(--line2)}

/* ---------- 亮点 ---------- */
.hl{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.hl{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.hl{grid-template-columns:repeat(3,1fr);gap:14px}}
.hc{
  position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);contain:content;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.hc::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--p),var(--a))}
.hc:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--line2)}
.hc .v{
  font-size:1.6rem;font-weight:800;line-height:1.15;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--p),var(--a));
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
.hc .l{margin-top:3px;font-size:13.5px;font-weight:700}
.hc .d{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.65}

/* ---------- Tabs ---------- */
.tabs{
  display:flex;gap:4px;padding:4px;margin-bottom:18px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-height:44px;padding:0 16px;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:linear-gradient(135deg,var(--p),var(--a));color:var(--bt);box-shadow:0 8px 18px -10px var(--p)}
.tab:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.tp{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{
  content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--p),var(--a) 55%,transparent);opacity:.45;
}
.ti{position:relative;padding-bottom:22px}
.ti:last-child{padding-bottom:0}
.ti::before{
  content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:3px solid var(--p);box-shadow:0 0 0 4px var(--ps);
  transition:transform .2s ease;
}
.ti:hover::before{transform:scale(1.15)}
.ti-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.ti-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.tm{
  font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);
  border:1px solid var(--line);padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.ti-org{margin:3px 0 8px;font-size:13.5px;font-weight:600;color:var(--p)}
.bl{display:flex;flex-direction:column;gap:5px}
.bl li{position:relative;padding-left:15px;font-size:13.6px;color:var(--muted);line-height:1.7}
.bl li::before{content:"";position:absolute;left:2px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--a);opacity:.85}

/* ---------- 项目 ---------- */
.pj{display:grid;gap:12px}
@media(min-width:600px){.pj{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.pj{grid-template-columns:repeat(3,1fr);gap:16px}}
.pc{
  display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);overflow:hidden;contain:content;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.pc:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--line2)}
.cover{margin:-16px -16px 6px;overflow:hidden;background:var(--chip)}
.cover img{width:100%;height:auto;display:block}
.pj-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.pj-top h3{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.st{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-a{color:var(--p);background:var(--ps)}
.st-b{color:var(--a);background:var(--as)}
.pc p{margin:0;font-size:13.4px;color:var(--muted);line-height:1.75}
.stack{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}
.chip{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--chip);border:1px solid var(--line);padding:3px 9px;border-radius:7px}

/* ---------- 技能 ---------- */
.sk{display:grid;gap:12px}
@media(min-width:600px){.sk{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.sk{grid-template-columns:repeat(3,1fr);gap:16px}}
.sc{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh);contain:content;transition:transform .22s ease,box-shadow .22s ease;
}
.sc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:10px}
.lv{font-size:11.5px;font-weight:700;color:var(--p);background:var(--ps);padding:2px 9px;border-radius:999px}
.bar{height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--p),var(--a));transition:width .9s cubic-bezier(.22,.61,.36,1)}
.sc p{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.7}

/* ---------- 获奖 ---------- */
.aw{display:grid;gap:12px}
@media(min-width:600px){.aw{grid-template-columns:repeat(2,1fr);gap:14px}}
.ac{
  display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);contain:content;
  transition:transform .22s ease,box-shadow .22s ease;
}
.ac:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.ai{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--a));color:var(--bt)}
.ac-name{font-size:14.5px;font-weight:700}
.ac-org{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- Dock（移动端底部操作栏） ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:var(--nav);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-top:1px solid var(--line);
}
@media(min-width:640px){.dock{display:none}}
.dk{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:48px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,background-color .15s ease;
}
.dk:active{transform:scale(.96)}
.dk-main{background:linear-gradient(135deg,var(--p),var(--a));color:var(--bt);box-shadow:0 8px 20px -12px var(--p)}

/* ---------- 返回顶部 / Toast ---------- */
.tot{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:80;
  width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);
  color:var(--text);box-shadow:var(--sh);cursor:pointer;display:grid;place-items:center;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .25s ease,transform .25s ease,border-color .2s ease;
}
.tot.on{opacity:1;pointer-events:auto;transform:none}
.tot:hover{border-color:var(--line2)}
@media(min-width:640px){.tot{bottom:24px}}
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:200;
  transform:translate(-50%,14px);background:var(--text);color:var(--bg);
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;
  max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--sh);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){.toast{bottom:34px}}

/* ---------- 页脚 ---------- */
.footer{
  position:relative;z-index:1;margin-top:50px;padding:24px 16px 40px;
  border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12.5px;
}
.footer p{margin:0 0 6px}
.footer-sub{opacity:.82}

/* ---------- 进入动画 ---------- */
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,.61,.36,1)}
.rv.in{opacity:1;transform:none}

/* ---------- 减少动效 ---------- */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1!important;transform:none!important}
}

/* ---------- 打印 ---------- */
@media print{
  :root{
    --bg:#fff;--card:#fff;--text:#111;--muted:#444;--line:#e3e3e3;--line2:#ccc;
    --p:#2743b0;--a:#0a7f7f;--ps:#eef2ff;--as:#e6f7f7;--chip:#f4f5f8;
    --sh:none;--sh2:none;--nav:#fff;--g1:transparent;--g2:transparent;--bt:#fff;
  }
  @page{size:A4;margin:12mm}
  body{font-size:12.5px;background:#fff;padding-bottom:0}
  body::before{display:none!important}
  .nav,.dock,.tot,.toast,.tabs,.no-print{display:none!important}
  .wrap{max-width:100%;padding:0}
  .hero{padding-top:0}

function bindTabs(scope){
  var list=scope.querySelector('[role="tablist"]');
  if(!list) return;
  var tabs=[].slice.call(list.querySelectorAll('[role="tab"]'));
  if(!tabs.length) return;

  function act(i,focus){
    tabs.forEach(function(tab,j){
      var on=j===i;
      tab.setAttribute('aria-selected',String(on));
      tab.tabIndex=on?0:-1;
      var p=document.getElementById(tab.getAttribute('aria-controls'));
      if(p) p.hidden=!on;
    });
    if(focus) tabs[i].focus();
  }
  tabs.forEach(function(tab,i){
    tab.addEventListener('click',function(){act(i,false);});
    tab.addEventListener('keydown',function(e){
      var n=-1;
      if(e.key==='ArrowRight') n=(i+1)%tabs.length;
      else if(e.key==='ArrowLeft') n=(i-1+tabs.length)%tabs.length;
      else if(e.key==='Home') n=0;
      else if(e.key==='End') n=tabs.length-1;
      if(n>=0){e.preventDefault();act(n,true);}
    });
  });
}

      return '<div class="ti">'+
        '<div class="ti-head"><h3>'+e.s+'</h3><span class="tm">'+e.t+'</span></div>'+
        '<div class="ti-org">'+e.m+'</div>'+bullets(e.b)+
      '</div>';
    }).join('')+'</div>';
}

function renderAw(){
  $('#aw').innerHTML=head('06','获奖与证书','荣誉记录')+
    '<div class="aw">'+R.aw.map(function(a){
      return '<div class="ac"><div class="ai" aria-hidden="true">'+I.award+'</div>'+
        '<div><div class="ac-name">'+a.n+'</div><div class="ac-org">'+a.o+'</div></div></div>';
    }).join('')+'</div>';
}

/* ============ 进度条 ============ */
function fillBars(){
  var bars=[].slice.call(document.querySelectorAll('.bar i'));
  if(!bars.length) return;
  if(!('IntersectionObserver' in window)){
    bars.forEach(function(b){b.style.width=b.getAttribute('data-w');});
    return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        e.target.style.width=e.target.getAttribute('data-w');
        io.unobserve(e.target);
      }
    });
  },{threshold:.15});
  bars.forEach(function(b){io.observe(b);});
}

/* ============ 邮箱复制 ============ */
function buildEmail(){return R.eu+'@'+R.ed;}

function legacyCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');
    el.id='toast';el.className='toast';
    el.setAttribute('role','status');el.setAttribute('aria-live','polite');
    document.body.appendChild(el);
  }
  el.textContent=msg;
  requestAnimationFrame(function(){el.classList.add('on');});
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('on');},2200);
}

function copyEmail(){
  var email=buildEmail();
  function ok(){toast('邮箱已复制：'+email);}
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(email).then(ok,function(){legacyCopy(email);ok();});
  }else{
    legacyCopy(email);ok();
  }
}

/* ============ 主题 ============ */
function initTheme(){
  var btn=$('#themeBtn');
  if(!btn) return;
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('zy-theme',next);}catch(e){}
  });
}

/* ============ 打印 ============ */
function initPrint(){
  var p=$('#printBtn'), d=$('#dkPrint');
  function go(){window.print();}
  if(p) p.addEventListener('click',go);
  if(d) d.addEventListener('click',go);
}

/* ============ 返回顶部 ============ */
function initToTop(){
  var btn=$('#toTop');
  if(!btn) return;
  var ticking=false;
  function onScroll(){
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(function(){
      btn.classList.toggle('on',window.scrollY>420);
      ticking=false;
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
  btn.addEventListener('click',function(){
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  });
}

/* ============ 滚动高亮 ============ */
function initSpy(){
  var links=[].slice.call(document.querySelectorAll('.nav-links a'));
  if(!links.length||!('IntersectionObserver' in window)) return;
  var map={},secs=[];
  links.forEach(function(l){
    var id=l.getAttribute('href');
    if(!id||id.charAt(0)!=='#') return;
    var s=document.querySelector(id);
    if(!s) return;
    map[s.id]=l;secs.push(s);
  });
  if(!secs.length) return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      links.forEach(function(l){l.classList.remove('on');});
      var a=map[e.target.id];
      if(a) a.classList.add('on');
    });
  },{rootMargin:'-74px 0px -68% 0px',threshold:0});
  secs.forEach(function(s){io.observe(s);});
}

/* ============ 进入动画 ============ */
function initReveal(){
  var items=[].slice.call(document.querySelectorAll('.rv'));
  if(!items.length) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce||!('IntersectionObserver' in window)){
    items.forEach(function(el){el.classList.add('in');});
    return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  },{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  items.forEach(function(el){io.observe(el);});
}

/* ============ 事件委托 ============ */
function initCopy(){
  document.addEventListener('click',function(e){
    var t=e.target.closest?e.target.closest('[data-copy]'):null;
    if(!t) return;
    e.preventDefault();
    copyEmail();
  });
}

/* ============ 年份 ============ */
function initYear(){
  var y=$('#year');
  if(y) y.textContent=String(new Date().getFullYear());
}

/* ============ 初始化 ============ */
function init(){
  renderHero();
  renderHL();
  renderExp();
  renderPj();
  renderSk();
  renderEdu();
  renderAw();
  fillBars();
  initTheme();
  initPrint();
  initToTop();
  initSpy();
  initReveal();
  initCopy();
  initYear();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init,{once:true});
}else{
  init();
}
})();
</script>
